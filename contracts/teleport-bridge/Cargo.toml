[package]
name = "teleport-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-chain asset bridge with Merkle proof verification, nullifiers, and validator federation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
