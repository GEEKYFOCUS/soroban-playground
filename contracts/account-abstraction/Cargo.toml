[package]
name = "account-abstraction"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ERC-4337 style smart wallet with social recovery guardians and session keys"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
