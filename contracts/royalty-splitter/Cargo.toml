[package]
name = "royalty-splitter"
version = "0.1.0"
edition = "2021"
description = "Hierarchical IP royalty splitter with nested multi-tier beneficiaries and pull-payment claiming"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
